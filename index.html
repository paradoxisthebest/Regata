  <style>
    :root{color-scheme:dark;--bg:#101114;--panel:#17181d;--panel2:#1d1e24;--line:#2a2b33;--muted:#92939e;--text:#f2f1f5;--purple:#a98bff;--green:#73e0b0;--yellow:#f4cd79;--red:#ff8585;--radius:12px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}button,input,textarea,select{font:inherit}button{color:inherit;cursor:pointer}a{color:inherit;text-decoration:none}.app{min-height:100vh;display:flex;flex-direction:column}.topbar{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:26px;background:#131418}.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:18px;letter-spacing:-.5px}.brandmark{width:29px;height:29px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(145deg,#c1a8ff,#8062e8);color:#17131f;font-size:16px;font-weight:900}.nav{display:flex;align-items:center;gap:22px;color:var(--muted);font-size:13px}.nav a.active{color:var(--text)}.top-actions{margin-left:auto;display:flex;gap:10px;align-items:center}.avatar{width:30px;height:30px;border-radius:50%;background:#302848;color:#d7c8ff;display:grid;place-items:center;font-size:12px;font-weight:700}.btn{border:1px solid var(--line);border-radius:8px;padding:8px 13px;background:var(--panel2);font-size:12px;font-weight:650;transition:.15s}.btn:hover{border-color:#555360;background:#25262d}.btn.primary{border-color:#a98bff;background:#a98bff;color:#17131f}.btn.primary:hover{background:#b9a2ff}.btn.ghost{background:transparent}.btn.small{padding:6px 9px}.main{width:min(1360px,100%);margin:0 auto;padding:32px 28px 56px;flex:1}.welcome{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:25px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.6px;color:var(--purple);font-weight:750}.welcome h1{font-size:27px;letter-spacing:-.8px;margin:8px 0 5px}.welcome p{margin:0;color:var(--muted);font-size:13px}.welcome-actions{display:flex;gap:9px}.workbench{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--panel);box-shadow:0 18px 70px #0003}.projectbar{height:52px;padding:0 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.project-name{border:0;background:transparent;color:var(--text);font-size:13px;font-weight:700;width:180px;outline:none}.saved{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}.saved:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green)}.project-actions{margin-left:auto;display:flex;align-items:center;gap:8px}.workspace{height:min(650px,68vh);min-height:490px;display:grid;grid-template-columns:205px minmax(330px,1fr) minmax(300px,.8fr)}.sidebar{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.side-head{padding:15px 13px 10px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:10px;font-weight:750;letter-spacing:1.1px}.icon-btn{width:25px;height:25px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:17px}.icon-btn:hover{color:white;background:#2a2b33}.file-list{padding:4px 8px;display:grid;gap:2px}.file-row{padding:8px 9px;border-radius:6px;color:#c5c4cc;font-size:12px;display:flex;gap:9px;align-items:center;cursor:pointer}.file-row:hover,.file-row.selected{background:#292833;color:white}.file-icon{font-size:11px;color:#9e8cff;width:14px;text-align:center}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding:13px;color:var(--muted);font-size:11px;line-height:1.6}.editor{min-width:0;display:flex;flex-direction:column}.editor-top{height:41px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 13px;gap:12px}.tab{height:100%;display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--purple);font-size:12px;color:#e4e0ef}.editor-tools{margin-left:auto;display:flex;gap:7px}.language-row{height:38px;display:flex;align-items:center;gap:9px;padding:0 14px;border-bottom:1px solid #25262c;color:var(--muted);font-size:11px}.language-row select{border:0;color:#d4d1dc;background:transparent;outline:none;font-size:11px}.editor-area{position:relative;flex:1;display:grid;grid-template-columns:42px 1fr;overflow:hidden;background:#15161a}.line-numbers{margin:0;padding:16px 10px 20px 0;text-align:right;color:#555660;font:12px/1.72 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre;overflow:hidden;user-select:none}.code-input{width:100%;height:100%;resize:none;border:0;outline:0;background:transparent;color:#dedce7;padding:16px 15px 20px 0;font:12px/1.72 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:2;white-space:pre;overflow:auto;caret-color:#c4aaff}.console{height:105px;border-top:1px solid var(--line);background:#141519;padding:10px 14px;font:11px/1.7 ui-monospace,monospace;color:#aaa9b4;overflow:auto}.console-head{display:flex;justify-content:space-between;color:#777883;font:10px system-ui;letter-spacing:.8px;margin-bottom:5px}.console-line{color:var(--green)}.preview{border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;background:#f8f8fb;color:#171820}.preview-head{height:41px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 13px;color:#e4e0ef;font-size:12px}.preview-head .live{margin-left:auto;color:var(--green);font-size:10px;display:flex;align-items:center;gap:6px}.live:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green)}.preview-frame{border:0;width:100%;height:100%;flex:1;background:white}.hint{padding:9px 13px;border-top:1px solid #dedee4;background:white;color:#737582;font-size:10px}.below{display:grid;grid-template-columns:1.5fr 1fr;gap:15px;margin-top:17px}.info-card{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:17px 18px}.info-card h2{font-size:12px;margin:0 0 9px}.info-card p{color:var(--muted);font-size:11px;line-height:1.6;margin:0}.stack{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}.chip{font-size:10px;color:#c3b4ff;border:1px solid #453b62;background:#262130;padding:5px 8px;border-radius:999px}.share-view{max-width:980px;margin:45px auto;padding:0 20px}.share-card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}.share-meta{padding:20px 22px;border-bottom:1px solid var(--line)}.share-meta h1{margin:0 0 5px;font-size:23px}.share-meta p{margin:0;color:var(--muted);font-size:12px}.share-layout{display:grid;grid-template-columns:220px 1fr;min-height:450px}.share-files{padding:15px;border-right:1px solid var(--line)}.share-files h3{font-size:10px;letter-spacing:1px;color:var(--muted)}.share-code{overflow:auto;padding:17px;font:12px/1.75 ui-monospace,monospace;white-space:pre;color:#dedce7;background:#15161a}.share-code pre{margin:0}.notice{padding:13px;color:var(--muted);font-size:11px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);padding:10px 15px;border:1px solid #4d4368;border-radius:9px;background:#25212e;color:#eee8ff;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}.modal-backdrop{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px;z-index:4}.modal{width:min(520px,100%);border:1px solid #393743;border-radius:13px;background:#1a1b20;padding:22px;box-shadow:0 20px 80px #0008}.modal h2{font-size:18px;margin:0 0 8px}.modal p{color:var(--muted);font-size:12px;line-height:1.6}.linkbox{display:flex;gap:8px;margin:16px 0}.linkbox input{min-width:0;flex:1;border:1px solid var(--line);border-radius:7px;background:#111216;color:#ddd;padding:10px;font-size:11px}.modal-foot{display:flex;justify-content:flex-end;gap:8px}.empty{color:var(--muted);font-size:11px;padding:12px}.mobile-note{display:none}
    @media(max-width:900px){.workspace{grid-template-columns:165px minmax(300px,1fr);height:620px}.preview{display:none}.below{grid-template-columns:1fr}.main{padding:25px 18px}.nav{gap:12px}.mobile-note{display:block;color:var(--muted);font-size:11px;margin-top:10px}}
    @media(max-width:600px){.topbar{padding:0 14px;height:56px}.nav{display:none}.main{padding:22px 12px}.welcome{align-items:flex-start;gap:15px;flex-direction:column}.welcome h1{font-size:23px}.workspace{grid-template-columns:110px minmax(0,1fr);min-height:440px;height:58vh}.side-head{padding:12px 8px;font-size:9px}.file-row{padding:8px 5px;font-size:10px;gap:5px}.file-name{overflow:hidden;text-overflow:ellipsis}.side-bottom{font-size:9px;padding:9px}.projectbar{padding:0 9px;gap:6px}.project-name{width:118px;font-size:11px}.project-actions{gap:5px}.project-actions .btn{padding:7px;font-size:10px}.saved{display:none}.editor-tools{gap:3px}.welcome-actions .btn{font-size:11px}.below{gap:10px}}
  </style>

<body>
  <div id="app" class="app"></div><div id="toast" class="toast"></div>
  <script>
  (()=>{
    const LANGS=['HTML','CSS','JavaScript','TypeScript','Python','Java','C','C++','C#','Go','Rust','PHP','Ruby','Swift','Kotlin','SQL','Bash','JSON','Markdown'];
    const starter={
      'index.html':{lang:'HTML',code:'<!doctype html>\n<html lang="en">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n  <title>My Regata project</title>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <main class="card">\n    <span class="badge">✦ YOUR NEXT IDEA</span>\n    <h1>Make it happen.</h1>\n    <p>A little code can take you anywhere.<br>Start experimenting and see what you can build.</p>\n    <button onclick="sayHello()">Say hello <span>→</span></button>\n    <div id="message"></div>\n  </main>\n  <script src="script.js"><\\/script>\n</body>\n</html>'},
      'style.css':{lang:'CSS',code:'* { box-sizing: border-box; }\nbody {\n  margin: 0; min-height: 100vh;\n  display: grid; place-items: center;\n  background: #101114; color: #f4f1fa;\n  font-family: system-ui, sans-serif;\n}\n.card {\n  width: min(440px, 90vw); padding: 46px;\n  border: 1px solid #34313e; border-radius: 20px;\n  background: linear-gradient(145deg, #211e2c, #17181d);\n  box-shadow: 0 30px 80px #0006;\n}\n.badge { color: #b89cff; font-size: 11px; letter-spacing: 1.5px; }\nh1 { margin: 18px 0 10px; font-size: 38px; letter-spacing: -1.5px; }\np { color: #aaa7b4; line-height: 1.7; font-size: 14px; }\nbutton { margin-top: 16px; padding: 12px 17px; border: 0; border-radius: 8px; background: #b49aff; color: #211a2d; font-weight: 700; cursor: pointer; }\nbutton span { margin-left: 12px; }\n#message { margin-top: 16px; color: #78dfb2; font-size: 13px; }'},
      'script.js':{lang:'JavaScript',code:'function sayHello() {\n  document.querySelector("#message").textContent = "You did it! Keep building ✨";\n}\n\n// Try changing the text, then press Run to see it.'}
    };
    const app=document.getElementById('app');let project=loadProject(),active=Object.keys(project.files)[0],isShared=false;
    function loadProject(){try{const x=JSON.parse(localStorage.getItem('regata-project'));if(x&&x.files)return x}catch(e){}return {name:'My first project',files:JSON.parse(JSON.stringify(starter))}}
    function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function extIcon(f){const ext=f.split('.').pop();return ({html:'◈',css:'◉',js:'⌘',ts:'⌘',py:'◆',json:'{}',md:'M',sql:'▤'})[ext]||'◇'}
    function save(){localStorage.setItem('regata-project',JSON.stringify(project));const s=document.querySelector('.saved');if(s)s.textContent='Saved just now'}
    function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}
    function render(){
      if(location.hash.startsWith('#/share/')){renderShare();return}
      isShared=false;const f=project.files[active]||{};
      app.innerHTML=`<header class="topbar"><a class="brand" href="#"><span class="brandmark">R</span>regata</a><nav class="nav"><a class="active" href="#">Workspace</a><a href="#learn" onclick="document.getElementById('learn').scrollIntoView({behavior:'smooth'})">Learn</a><a href="#projects" onclick="toast('Your projects are saved in this browser.')">My projects</a></nav><div class="top-actions"><button class="btn ghost" onclick="newProject()">＋ New project</button><div class="avatar">R</div></div></header>
      <main class="main"><section class="welcome"><div><div class="eyebrow">YOUR CREATIVE WORKSPACE</div><h1>Ideas into reality.</h1><p>A friendly place to learn, experiment, and build something you’re proud of.</p></div><div class="welcome-actions"><button class="btn" onclick="addFile()">＋ Add file</button><button class="btn primary" onclick="publish()">↗ &nbsp;Publish project</button></div></section>
      <section class="workbench"><div class="projectbar"><span style="color:var(--purple)">◈</span><input class="project-name" aria-label="Project name" value="${esc(project.name)}" onchange="project.name=this.value;save()"><span class="saved">Saved just now</span><div class="project-actions"><button class="btn small ghost" onclick="downloadProject()">↓ Export</button><button class="btn small primary" onclick="runCode()">▶ &nbsp;Run</button></div></div>
      <div class="workspace"><aside class="sidebar"><div class="side-head">PROJECT FILES<button class="icon-btn" title="Add file" onclick="addFile()">＋</button></div><div class="file-list">${Object.keys(project.files).map(n=>`<div class="file-row ${n===active?'selected':''}" onclick="selectFile('${esc(n)}')"><span class="file-icon">${extIcon(n)}</span><span class="file-name">${esc(n)}</span></div>`).join('')}</div><div class="side-bottom">Build with the tools you know.<br>Every great project starts somewhere.</div></aside>
      <section class="editor"><div class="editor-top"><div class="tab"><span class="file-icon">${extIcon(active)}</span>${esc(active)}</div><div class="editor-tools"><button class="icon-btn" title="Rename file" onclick="renameFile()">✎</button><button class="icon-btn" title="Delete file" onclick="deleteFile()">×</button></div></div><div class="language-row"><span>Language</span><select aria-label="File language" onchange="changeLanguage(this.value)">${LANGS.map(l=>`<option ${f.lang===l?'selected':''}>${l}</option>`).join('')}</select><span style="margin-left:auto">UTF-8</span></div><div class="editor-area"><pre class="line-numbers" id="lines"></pre><textarea class="code-input" id="code" spellcheck="false" aria-label="Code editor">${esc(f.code||'')}</textarea></div><div class="console"><div class="console-head"><span>OUTPUT</span><button class="icon-btn" style="font-size:12px" onclick="clearConsole()">Clear</button></div><div id="console-text">Ready when you are. Press Run to preview your project.</div></div></section>
      <section class="preview"><div class="preview-head">Preview <span class="live">LIVE PREVIEW</span></div><iframe title="Project preview" class="preview-frame" id="preview" sandbox="allow-scripts"></iframe><div class="hint">Your HTML, CSS, and JavaScript come together here.</div></section></div></section>
      <p class="mobile-note">On smaller screens, run your project to refresh the live preview.</p><div class="below" id="learn"><article class="info-card"><h2>One workspace. Many possibilities.</h2><p>Keep related files together and explore popular programming languages. Regata’s live preview currently runs browser projects made with HTML, CSS, and JavaScript. Other languages are ready for you to write and export.</p><div class="stack"><span class="chip">HTML</span><span class="chip">CSS</span><span class="chip">JavaScript</span><span class="chip">Python</span><span class="chip">TypeScript</span><span class="chip">+ 14 more</span></div></article><article class="info-card"><h2>Share your creation</h2><p>Publish to create an unlisted link containing your project files. Anyone with the link can view them; links are not password-protected.</p><button class="btn small" style="margin-top:12px" onclick="publish()">↗ &nbsp;Create a share link</button></article></div></main>`;
      const code=document.getElementById('code');code.addEventListener('input',()=>{project.files[active].code=code.value;updateLines();save()});code.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();const a=code.selectionStart,b=code.selectionEnd;code.setRangeText('  ',a,b,'end');code.dispatchEvent(new Event('input'))}});updateLines();runCode(true)
    }
    function updateLines(){const c=document.getElementById('code'),ln=document.getElementById('lines');if(c&&ln){ln.textContent=Array.from({length:Math.max(1,c.value.split('\n').length)},(_,i)=>i+1).join('\n');ln.scrollTop=c.scrollTop;c.onscroll=()=>ln.scrollTop=c.scrollTop}}
    function selectFile(n){if(project.files[n]){active=n;render()}}
    function changeLanguage(lang){project.files[active].lang=lang;save();toast('Language set to '+lang)}
    function addFile(){const name=prompt('Name your new file (for example: app.py):');if(!name)return;const safe=name.trim();if(!safe||safe.includes('/')||safe.includes('\\'))return toast('Please use a simple file name.');if(project.files[safe])return toast('That file already exists.');const ext=safe.split('.').pop().toLowerCase(),map={html:'HTML',htm:'HTML',css:'CSS',js:'JavaScript',ts:'TypeScript',py:'Python',java:'Java',c:'C',cpp:'C++',cs:'C#',go:'Go',rs:'Rust',php:'PHP',rb:'Ruby',swift:'Swift',kt:'Kotlin',sql:'SQL',sh:'Bash',json:'JSON',md:'Markdown'};project.files[safe]={lang:map[ext]||'JavaScript',code:''};active=safe;save();render()}
    function renameFile(){const next=prompt('Rename file:',active);if(!next||next===active)return;if(project.files[next])return toast('A file with that name already exists.');project.files[next]=project.files[active];delete project.files[active];active=next;save();render()}
    function deleteFile(){if(Object.keys(project.files).length<2)return toast('Keep at least one project file.');if(!confirm(`Delete ${active}?`))return;delete project.files[active];active=Object.keys(project.files)[0];save();render()}
    function newProject(){if(!confirm('Start a new project? Your current project is saved in this browser.'))return;project={name:'Untitled project',files:JSON.parse(JSON.stringify(starter))};active='index.html';save();render()}
    function clearConsole(){const c=document.getElementById('console-text');if(c)c.textContent='Output cleared.'}
    function runCode(quiet=false){const output=document.getElementById('console-text'),frame=document.getElementById('preview');if(!frame)return;const htmlFile=Object.keys(project.files).find(n=>n.toLowerCase().endsWith('.html'));if(!htmlFile){frame.srcdoc='<body style="font:14px system-ui;padding:24px;color:#555">Add an HTML file to see a browser preview.</body>';if(output)output.textContent='No HTML file found. Your code is saved and can be exported.';return}let html=project.files[htmlFile].code||'';const css=Object.keys(project.files).filter(n=>n.toLowerCase().endsWith('.css')).map(n=>project.files[n].code).join('\n');const js=Object.keys(project.files).filter(n=>/\.(js|ts)$/i.test(n)).map(n=>project.files[n].code).join('\n');html=html.replace(/<link\b[^>]*href=["'][^"']+\.css[^"']*["'][^>]*>/gi,'').replace(/<script\b[^>]*src=["'][^"']+\.(?:js|ts)[^"']*["'][^>]*>\s*<\/script>/gi,'');const style=css?`<style>${css.replace(/<\/style/gi,'<\\/style')}</style>`:'';const script=js?`<script>${js.replace(/<\/script/gi,'<\\/script')}<\/script>`:'';const content=html.includes('</head>')?html.replace('</head>',style+'</head>'):style+html;frame.srcdoc=content.includes('</body>')?content.replace('</body>',script+'</body>'):content+script;if(output)output.innerHTML='<span class="console-line">✓ Preview updated successfully.</span>'}
    function downloadProject(){const files=JSON.stringify(project,null,2),blob=new Blob([files],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(project.name||'regata-project').toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.json';a.click();URL.revokeObjectURL(a.href);toast('Project exported as a JSON file.')}
    function b64encode(s){const bytes=new TextEncoder().encode(s);let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
    function b64decode(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
    function publish(){const data=b64encode(JSON.stringify({name:project.name,files:project.files}));const url=location.href.split('#')[0]+'#/share/'+data;showModal(url)}
    function showModal(url){const box=document.createElement('div');box.className='modal-backdrop';box.innerHTML=`<section class="modal" role="dialog" aria-modal="true"><h2>Your project link is ready ✨</h2><p>This unlisted link includes your project files in the URL. Anyone with the link can view and copy the code. It is not password-protected; don’t include secrets or private information.</p><div class="linkbox"><input id="share-link" readonly value="${esc(url)}"><button class="btn primary" onclick="copyLink()">Copy link</button></div><div class="modal-foot"><button class="btn" onclick="this.closest('.modal-backdrop').remove()">Done</button><button class="btn" onclick="window.open(document.getElementById('share-link').value,'_blank','noopener')">Open link</button></div></section>`;document.body.appendChild(box);box.addEventListener('click',e=>{if(e.target===box)box.remove()})}
    async function copyLink(){const i=document.getElementById('share-link');try{await navigator.clipboard.writeText(i.value)}catch(e){i.select();document.execCommand('copy')}toast('Share link copied!')}
    function renderShare(){try{const data=JSON.parse(b64decode(location.hash.split('/').slice(2).join('/')));if(!data.files)throw Error();const names=Object.keys(data.files),current=names[0];app.innerHTML=`<header class="topbar"><a class="brand" href="${location.href.split('#')[0]}"><span class="brandmark">R</span>regata</a><div class="top-actions"><span style="font-size:11px;color:var(--muted)">A project shared with you</span><a class="btn primary" href="${location.href.split('#')[0]}">Create your own →</a></div></header><main class="share-view"><div class="share-card"><div class="share-meta"><div class="eyebrow">REGATA PROJECT</div><h1>${esc(data.name||'Untitled project')}</h1><p>${names.length} ${names.length===1?'file':'files'} · View-only share</p></div><div class="share-layout"><aside class="share-files"><h3>PROJECT FILES</h3>${names.map((n,i)=>`<div class="file-row ${i===0?'selected':''}" onclick="showSharedFile('${esc(n)}')"><span class="file-icon">${extIcon(n)}</span><span class="file-name">${esc(n)}</span></div>`).join('')}</aside><section class="share-code"><pre id="shared-code">${esc(data.files[current].code||'')}</pre></section></div><div class="notice">This is an unlisted link, not a password-protected private project. Keep the link to yourself if you want to limit access.</div></div></main>`;window.showSharedFile=n=>{if(data.files[n])document.getElementById('shared-code').textContent=data.files[n].code||''}}catch(e){app.innerHTML='<main class="share-view"><div class="share-card share-meta"><h1>We could not open this project link.</h1><p>The link may be incomplete or the project data may be invalid.</p><a class="btn primary" href="'+location.href.split('#')[0]+'">Go to Regata</a></div></main>'}}
    window.newProject=newProject;window.addFile=addFile;window.selectFile=selectFile;window.changeLanguage=changeLanguage;window.renameFile=renameFile;window.deleteFile=deleteFile;window.runCode=runCode;window.downloadProject=downloadProject;window.publish=publish;window.copyLink=copyLink;window.clearConsole=clearConsole;window.addEventListener('hashchange',render);render();
  })();
  </script>
